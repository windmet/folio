    note: "把制作锁定和约束改为读者可理解的制作选择。"
  russian-takoyaki:
    copyAction: rewrite
    newBody: "濱拿到的那颗已经绿到几乎可以确认是 wasabi；后来回顾才补上，他最早抽中、看见绿色后因为「ひよって」直接放回。\n\n赛马与“识破后放回”在现场紧挨着出现，可以说赛马让这颗章鱼烧被忘在一边；但没有人明确说“因为赛马才忘掉”，所以这里不把它写成确定因果。\n\n最后由毫不知前情的堀金蒼平踩雷，现场原声也真的出现了「時限爆弾すぎるだろ！」。这条线因此同时有提议、被遗忘、延迟和最后踩雷的完整回收。"
    note: "保留因果谨慎，但移除高精度稿、录音和页面需等流程词。"
  shugo-yakiniku:
    copyAction: rewrite
    newDeck: "连接不稳、说完烤肉就消失，重开后小松只好替这句简短留言补成庆生。"
    newBody: "它几乎没有留下具体内容，却很有仲村的存在感；不必再替这句话添加复杂背景。"
    note: "低信息是编辑判断，不作为读者标签；改为简短留言。"
