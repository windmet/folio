  bingo-payback:
    copyAction: rewrite
    newDeck: "小松想一次还清大家的生日礼物，规则越玩越多，奖品也不断和中奖者形成意外的角色梗。"
    newBody: "小松本来只是想把欠大家的生日回礼一次结清，结果规则越玩越多，奖品也不断和中奖者形成意外的角色梗；唯一最想拿东西的濱反而没中主奖，伸手去抢寺島的 Amazon 卡，最后只剩参加赏。"
    note: "2026-08-10 semantic override：移除濱中奖判断，并把抢寺島卡作为独立节点接入。"
  birthday-payback:
    copyAction: rewrite
    newBody: "小松先对観世临时立下“以后也要记得给别人庆生”的规则；到了清典这里，他还认真问了 11 月 14 日。结果话刚说完，他才猛然想起：自己前面明明和内田聊了那么久，却完全忘了问内田生日。最早立规则的人，最后正好被自己的规则绊住。"
    note: "历史 RAW 恢复后，直接讲清从立规则到忘问内田生日的回收，不再向读者展示旧听辨谨慎说明。"
  hama-paid-drinking:
    copyAction: rewrite
    newDeck: "没带礼物却一路吃喝到最后；Amazon 轮自己没中，还伸手去抢寺島的卡，最后只拿到 1000 円参加赏，于是现场真的变成了“ギャラ飲み”。"
    newBody: "濱这晚的笑点不是“空手来却中了大奖”，而是始终没有中到主奖：从没带礼物、高价酒和“只关心自己出演作品”，一路发展到盯上 Amazon 礼券、抢寺島的卡。最后他和矢野作为仅剩的两名未中奖者拿到 1000 円参加赏，又亲口把它说成「ギャラ＋1000円」。这才是整条 running gag 的终点。"
    note: "2026-08-10 semantic override：濱没有中 Amazon 主奖，人物线终点改为抢卡与 1000 円参加赏。"
  broken-sword:
    copyAction: rewrite
    newBody: "直播里大家重新看的是昼场那次真事故：濱的刀真的折断，矢野那把只被削伤，碎片飞向舞台袖，幸好没有人受伤。偏偏下一句就是「刀で斬り合う時代は終わりじゃ」，自然得让不少观众以为本来就是演出。"
    note: "用事故经过和下一句台词构成故事，不再解释档案记录坐标。"
  kano-ojisan:
    copyAction: rewrite
    newBody: "狩野前面一路被吐槽越来越“おじさん”，厕所离席只是其中一个小插曲；等二次会真的点到 T-BOLAN，这条不断累积的おじさん线才终于落到歌单上。"
    note: "直接交代连续笑点如何落到歌单，不再向读者说明资料缺口。"
  muro-account:
    copyAction: rewrite
    newBody: "第一段 Space 结束前只来得及看到室元気的账号；重开后，对方自己说出了「乗っ取り」。所以这里最有趣的地方不是“室本人终于来了”，而是大家终于和这个账号建立对话，却连说话的人究竟是谁都不能完全确定。"
    note: "保留必须公开的身份边界，同时把它写成账号插曲本身的故事。"
  ore-shiri-making-of:
    copyAction: rewrite
    newBody: "从演员自己查流派，到清典调整身体重心，再到台本、血振り和 ensemble 的现场应对，这次复盘最后拼出了《俺知》动作与朗读形式是怎样一起被做出来的。"
    note: "改成制作过程的故事总结，不再解释 Thread 的编辑分层。"
  russian-takoyaki:
    copyAction: rewrite
    newBody: "濱拿到的那颗已经绿到几乎可以确认是 wasabi；后来回顾才补上，他最早抽中、看见绿色后因为「ひよって」直接放回。\n\n赛马确实发生在大家识破那颗章鱼烧之后，但没有人明确说“就是因为赛马才忘掉”，因此它更像时间上紧邻的巧合与干扰。\n\n最后，毫不知前情的堀金蒼平踩雷，现场直接冒出「時限爆弾すぎるだろ！」。从最初提议到被识破、遗忘，再到约 80 分钟后的延迟爆炸，这颗章鱼烧终于走完了整条回收线。"
    note: "把因果边界写成自然叙述，移除现场原声和不把它写成等编辑判断句。"
  shugo-yakiniku:
    copyAction: rewrite
    newDeck: "连接不稳、说完烤肉就消失，重开后小松只好替这句简短留言补成庆生。"
    newBody: "仲村好不容易接进来，几乎只留下“今晚去吃烤肉”就又掉线。重开以后，小松只好自顾自替他补成“因为我生日很开心，所以去吃烤肉庆祝”，把一条信息极少的留言硬凑成完整祝福。"
    note: "用掉线与小松强行补祝福构成故事，不再评论资料信息量。"
  terashima-big-dream:
    copyAction: rewrite
    newBody: "小松拿到的生日礼物票是 5-8 wide，寺島自己另外买的是 5-6。比赛结束时大家先喊「惜しい」，最后却只能承认「何にもなかった」——Big Dream 从八千万妄想一路回到零。"
    note: "用两张票和最终归零讲清笑点，不再写事件线如何裁决。"
